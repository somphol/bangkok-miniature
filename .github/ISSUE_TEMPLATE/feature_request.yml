name: Feature request
description: Suggest a landmark, interaction, visual or performance improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is a small, compressed diorama rather than a GIS or navigation product. Explain the
        visual or interaction problem before proposing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The gap in the scene, the confusing interaction or the missing context.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the scene do or show? A rough mockup or reference photo is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, or why they are worse.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Landmark / model
        - Geography / street plan
        - Buildings / city life
        - Lighting / water / atmosphere
        - UI / accessibility / i18n
        - Performance / build / docs
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links or references. Do not paste credentials or personal data.
