name: Bug report
description: Something in the scene, UI or build is broken.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce it; a screenshot and the
        console output help a lot. Security issues should follow SECURITY.md, not this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: The landmark flight points at the river, or the night toggle does nothing.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact sequence, including the URL and any clicks or keys.
      placeholder: |
        1. Open https://somphol.github.io/bangkok-miniature/?lang=en
        2. Click "Wat Arun"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131, Safari 18, Firefox 133…
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and device
      placeholder: macOS 15 / MacBook Pro, Windows 11, iPhone 15…
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL and parameters
      description: Include `?lang`, `?embed`, `?view` and `?capture` if you used them.
      placeholder: https://somphol.github.io/bangkok-miniature/?lang=th
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Paste any errors, and the output of `window.__scene.inspect()` if the scene loaded.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. A before/after is ideal for a visual regression.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked that the browser has WebGL 2 and hardware acceleration enabled.
        - label: I searched existing issues for the same problem.
          required: true
